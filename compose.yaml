services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: orderops
      POSTGRES_PASSWORD: orderops
      POSTGRES_DB: orderops
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - orderops_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderops -d orderops"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  orderops_data:
